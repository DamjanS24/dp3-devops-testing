name: monitor

# Observability at the level a static site deserves. There is no Prometheus to
# scrape here, so it is measured from the outside, the way a visitor
# experiences it. Every six hours the same browser suite runs against the live
# site, plus a reachability and load-time measurement.
#
# This closes the loop from the DevOps workshop. Monitoring feeds back into
# planning, and that happens here by opening an issue when the site is unwell.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

env:
  SITE_URL: https://damjans24.github.io/dp3-devops-testing/

jobs:
  health:
    name: is the site still healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Measure reachability and load time
        id: measurement
        env:
          SITE: ${{ vars.SITE_URL || env.SITE_URL }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE" || echo 000)
          seconds=$(curl -s -o /dev/null -w '%{time_total}' --max-time 15 "$SITE" || echo 0)
          {
            echo "code=$code"
            echo "seconds=$seconds"
            echo "site=$SITE"
          } >> "$GITHUB_OUTPUT"
          echo "$SITE answered $code in $seconds seconds"
          [ "$code" = "200" ]

      - name: Which version is live right now
        id: version
        continue-on-error: true
        env:
          SITE: ${{ vars.SITE_URL || env.SITE_URL }}
        run: |
          live=$(curl -s --max-time 15 "${SITE}version.txt" | tr -d '\r\n' || echo unknown)
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "live version $live"

      - name: The same browser suite against the live site
        env:
          E2E_BASE_URL: ${{ vars.SITE_URL || env.SITE_URL }}
        run: npm run e2e

      - name: Measurement in the summary
        if: always()
        run: |
          {
            echo "### Measurement"
            echo "- site ${{ steps.measurement.outputs.site }}"
            echo "- http ${{ steps.measurement.outputs.code }}"
            echo "- load time ${{ steps.measurement.outputs.seconds }} seconds"
            echo "- live commit \`${{ steps.version.outputs.live }}\`"
            echo "- result ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report when the site is unwell
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-monitor
          path: playwright-report
          retention-days: 7

      # The alarm. One open issue at a time, otherwise the list fills up.
      - name: Raise the alarm
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --label monitoring --state open --json number --jq '.[0].number')
          body="The scheduled check of $(date -u +'%Y-%m-%d %H:%M UTC') failed. Live commit \`${{ steps.version.outputs.live }}\`. See the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "updated existing alarm $existing"
          else
            gh label create monitoring --color B60205 --description "Outage found by the scheduled check" 2>/dev/null || true
            gh issue create --title "The site is not healthy" --label monitoring --body "$body"
            echo "created a new alarm"
          fi
