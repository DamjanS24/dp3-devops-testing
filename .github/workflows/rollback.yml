name: rollback

# Rolling production back to an earlier commit. Give it a sha, and this
# rebuilds exactly that commit and puts it live on Pages.
#
# Started two ways: by hand from the Actions tab, and automatically by block 6
# of ci-cd when the live checks fail after a deploy.
#
# Three deliberate choices worth defending.
#
# No tests here. That commit already passed them when it was merged, and it was
# verified on staging before it ever went live. A rollback that spends five
# minutes testing first is not a rollback. You roll back because something is
# broken right now.
#
# It rebuilds rather than reusing the artifact from the original run. Artifacts
# expire, and a rollback has to still work in three weeks.
#
# It goes straight to production and skips staging. Staging exists to stop a new
# release; a rollback is a return to a release that was already proven there.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to roll back to, 7 or 40 characters"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# The same group as ci-cd, so a rollback and an ordinary deploy cannot run over
# each other. Not cancel-in-progress here: a rollback must always finish.
concurrency:
  group: release-refs/heads/main
  cancel-in-progress: false

jobs:
  rollback:
    name: roll back production
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Show where we are going
        id: target
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Rolling back to $(git log -1 --format='%h  %s  (%ci)')"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Vite build
        run: npm run build

      - name: Stamp the build with its commit
        run: |
          echo "${{ steps.target.outputs.sha }}" > dist/version.txt
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      # Checking that the rollback actually landed, not just that the deploy
      # step said it was done.
      - name: Wait until production serves the rolled-back commit
        run: node scripts/wait-for-deploy.mjs "${{ steps.pages.outputs.page_url }}" "${{ steps.target.outputs.sha }}"

      - name: Smoke check the restored site
        run: node scripts/smoke.mjs "${{ steps.pages.outputs.page_url }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rollback"
            echo "- rolled back to \`${{ steps.target.outputs.short }}\`"
            echo "- result ${{ job.status }}"
            echo "- ${{ steps.pages.outputs.page_url }}"
            echo "- main is unchanged, the bad commit is still there and needs a revert"
          } >> "$GITHUB_STEP_SUMMARY"
