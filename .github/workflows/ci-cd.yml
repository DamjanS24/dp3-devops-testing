name: ci-cd

# De lopende band. Elke push naar main gaat langs vijf stations. Zodra een
# station een fout vindt, stopt de band en wordt er niets gedeployed.
#
#   1 lint   +   2 unit tests      (naast elkaar)
#            ->  3 build
#            ->  4 e2e tests in een echte browser, gedrag en toegankelijkheid
#            ->  5 deploy naar GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- station 1 ----------
  lint:
    name: 1 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript controle
        run: npm run typecheck

  # ---------- station 2, draait tegelijk met station 1 ----------
  unit:
    name: 2 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test
      - name: Samenvatting
        if: always()
        run: echo "Unit tests afgerond met status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------- station 3 ----------
  build:
    name: 3 build
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # GitHub Pages serveert de site onder /<repository-naam>/, dus die basis
      # moet in de build zitten, anders vindt de browser de bestanden niet.
      - name: Vite build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Dezelfde dist gaat naar station 4 en naar station 5, zodat er getest
      # wordt op precies de bestanden die live gaan.
      - name: Bewaar dist voor de e2e tests
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Zet dist klaar als Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---------- station 4 ----------
  e2e:
    name: 4 e2e tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Haal de gebouwde site op
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Installeer de browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run e2e

      - name: Bewaar het rapport als er iets faalt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ---------- station 5 ----------
  deploy:
    name: 5 deploy
    needs: e2e
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy naar GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Samenvatting
        run: echo "Live op ${{ steps.pages.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
