name: ci-cd

# The production line. Every push to main runs through six blocks. As soon as
# one block finds a problem the line stops and nothing is released.
#
#   1  lint + security   static checks, side by side, nothing depends on them
#   2  build             one artifact, and that one artifact is what every
#                        environment gets from here on
#   3  tests             unit tests and browser tests, all testing in one block
#   4  coverage          the gate that judges the coverage numbers
#   5  staging           deploy, then the full browser suite against the staging
#                        site, so a release is proven on a real host first
#   6  production        deploy the same artifact, smoke check it, and roll back
#                        automatically if the live site is not healthy
#
# Two things are worth pointing out about this order.
#
# The artifact is built once, in block 2, and every later block downloads that
# same artifact. Nothing rebuilds. That removes a whole class of failure where
# what you tested is not what you shipped.
#
# Blocks 5 and 6 only run on main. On a pull request the line stops after block
# 4, which is what branch protection requires to be green before a merge.
#
# Setup this workflow needs once, see also the staging block below:
#   - a repository called <main repo>-staging with Pages serving the gh-pages
#     branch
#   - a secret STAGING_DEPLOY_TOKEN, a fine-grained token with Contents: write
#     on that staging repository and nothing else

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege as the default. A block that needs more says so itself.
permissions:
  contents: read

# One release at a time. On a pull request a new push cancels the old run,
# because that only costs runner minutes. On main it queues instead: cancelling
# a half-finished deploy, or worse a running rollback, leaves the live site in a
# state nobody chose.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  STAGING_REPOSITORY: DamjanS24/dp3-devops-testing-staging
  STAGING_URL: https://damjans24.github.io/dp3-devops-testing-staging/

jobs:
  # ===================== block 1, static checks =====================

  lint:
    name: 1 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck

  security:
    name: 1 security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because a secret removed three commits ago is
          # still in the repository.
          fetch-depth: 0

      - name: Scan the history for leaked secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source . --no-banner --redact

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The site has zero runtime dependencies, so this should always come back
      # at zero. The moment that changes, it shows up here. That is the point,
      # not the number.
      - name: Vulnerabilities in what actually ships
        run: npm audit --omit=dev --audit-level=high

      - name: Summary
        if: always()
        run: |
          {
            echo "### Security"
            echo "- secrets across the full history: gitleaks"
            echo "- shipping dependencies: \`npm audit --omit=dev\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===================== block 2, build once =====================

  build:
    name: 2 build
    needs: [lint, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The build uses a relative base, so these exact files work both under
      # /<staging repo>/ and under /<production repo>/. No environment-specific
      # build, and therefore no way for the two to differ.
      - name: Vite build
        run: npm run build

      # The commit this build came from, written into the output. Every deploy
      # check later polls for this value, so "the deploy finished" and "the site
      # really serves the new version" stop being the same claim.
      - name: Stamp the build with its commit
        run: |
          echo "$GITHUB_SHA" > dist/version.txt
          # Tells GitHub Pages not to run Jekyll over the output.
          touch dist/.nojekyll

      # This is the only artifact in the whole run. Blocks 3, 5 and 6 all
      # download this one, which is what makes "tested equals shipped" true.
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "### Build"
            echo "- commit \`$GITHUB_SHA\`"
            echo "- relative base, so one artifact serves every environment"
            echo '```'
            ls -la dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===================== block 3, all the testing =====================

  tests:
    name: 3 tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Fast first. Unit tests run in milliseconds and say where something is
      # broken; the browser tests say whether the product works.
      - name: Unit tests, with coverage
        run: npm run coverage

      # Handed to block 4, which is the block that judges the numbers.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

      # Behaviour and accessibility, against the built files in dist rather than
      # against the dev server.
      - name: Browser tests
        run: npm run e2e

      - name: Performance and accessibility budget
        run: |
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          npm run preview -- --port 4173 --strictPort --host 127.0.0.1 &
          npx wait-on "http://127.0.0.1:4173/" --timeout 60000
          npx -y lighthouse@12 "http://127.0.0.1:4173/" \
            --quiet --output=json --output-path=./lighthouse.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage"
          node scripts/lighthouse-budget.mjs lighthouse.json

      - name: Keep the reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report
            lighthouse.json
          retention-days: 7

  # ===================== block 4, the coverage gate =====================

  # Separate from block 3 on purpose. A threshold enforced inside the test run
  # reads as a failing test, which hides what actually went wrong. Red here
  # means one thing only: the logic is not covered well enough.
  coverage:
    name: 4 coverage
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Judge the coverage against the agreed minimum
        run: node scripts/coverage-gate.mjs

  # ===================== block 5, staging =====================

  # A second, real environment on its own host, with its own URL. The full
  # browser suite runs against it. Nothing reaches production that has not first
  # been proven here on a live site.
  staging:
    name: 5 staging
    needs: coverage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Pushed with a token scoped to Contents: write on the staging repository
      # and nothing else. The run's own GITHUB_TOKEN cannot reach another
      # repository, which is the whole reason this secret exists.
      - name: Publish to staging
        env:
          STAGING_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: |
          if [ -z "$STAGING_TOKEN" ]; then
            echo "::error::The secret STAGING_DEPLOY_TOKEN is not set, so there is nowhere to publish staging to."
            exit 1
          fi
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REPOSITORY}"
          git push -q --force \
            "https://x-access-token:${STAGING_TOKEN}@github.com/${STAGING_REPOSITORY}.git" \
            gh-pages
          echo "Pushed ${GITHUB_SHA} to ${STAGING_REPOSITORY}"

      - name: Wait until staging serves this commit
        run: node scripts/wait-for-deploy.mjs "$STAGING_URL" "$GITHUB_SHA"

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # The full suite, against a real deployed site. This is the heaviest gate
      # in the line and it sits before production, not after it.
      - name: The full browser suite against staging
        env:
          E2E_BASE_URL: ${{ env.STAGING_URL }}
        run: npm run e2e

      - name: Keep the report when staging fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: playwright-report
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          {
            echo "### Staging verified"
            echo "- $STAGING_URL"
            echo "- serving \`$GITHUB_SHA\`"
            echo "- the full browser suite passed against a live host"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===================== block 6, production =====================

  # Only reachable once staging is green. Deploys the same artifact, then asks
  # the one question staging cannot answer: did these files arrive here too.
  production:
    name: 6 production
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # Needed to start the rollback workflow.
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Packed straight from the downloaded artifact. There is no build step
      # here that could change the files between the test and the release.
      - name: Package for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Wait until production serves this commit
        run: node scripts/wait-for-deploy.mjs "${{ steps.pages.outputs.page_url }}" "$GITHUB_SHA"

      # A smoke check, not the suite again. The suite already passed against
      # staging. What is left to prove is that the page and every file it asks
      # for are actually being served from here.
      - name: Smoke check the live site
        run: node scripts/smoke.mjs "${{ steps.pages.outputs.page_url }}"

      # The safety net. Finds the last run on main that was fully green and
      # starts the rollback workflow on that commit.
      - name: Roll back to the last good release
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci-cd.yml/runs?branch=main&status=success&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .head_sha] | first")

          if [ -z "$previous" ] || [ "$previous" = "null" ]; then
            echo "::error::No earlier successful run found, so there is nothing to roll back to."
            exit 1
          fi

          echo "The live checks failed, rolling back to $previous"
          gh workflow run rollback.yml --ref main -f sha="$previous"
          {
            echo "### Rolled back automatically"
            echo "- the live checks failed after the deploy"
            echo "- rollback started towards \`$previous\`"
            echo "- note that main still holds the bad commit, a rollback buys time and does not fix the branch"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Production released"
            echo "- ${{ steps.pages.outputs.page_url }}"
            echo "- serving \`$GITHUB_SHA\`, the same artifact staging verified"
          } >> "$GITHUB_STEP_SUMMARY"
